name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sdk:
    name: SDK (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  token:
    name: Token (compile / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: token/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
